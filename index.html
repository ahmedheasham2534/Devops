<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>OpsForge Academy — DevOps Learning Dashboard</title>
<meta name="description" content="A complete DevOps learning, assessment, and hands-on project tracking platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 29,9 29,23 16,30 3,23 3,9' fill='%230E1317' stroke='%233ECF8E' stroke-width='2'/%3E%3Cpath d='M11 11l6 5-6 5M18 21h5' stroke='%233ECF8E' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>

<!-- ============ Splash screen ============ -->
<div id="splash">
  <div class="splash-mark">
    <svg width="64" height="64" viewBox="0 0 32 32">
      <polygon points="16,2 29,9 29,23 16,30 3,23 3,9" fill="var(--bg-elevated)" stroke="var(--accent)" stroke-width="1.6"/>
      <path d="M11 11l6 5-6 5M18 21h5" stroke="var(--accent)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="splash-name">Ops<span class="weight">Forge</span></div>
  <div class="splash-tagline">DevOps Academy · Learn. Prove it. Ship it.</div>
  <div class="splash-bar"></div>
</div>

<!-- ============ App shell ============ -->
<div id="app" class="ready">
  <div id="sidebar-scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-mark" width="30" height="30" viewBox="0 0 32 32">
        <polygon points="16,2 29,9 29,23 16,30 3,23 3,9" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.8"/>
        <path d="M11 11l6 5-6 5M18 21h5" stroke="var(--accent)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="brand-text">Ops<span class="weight">Forge</span></div>
        <div class="brand-sub">DEVOPS ACADEMY</div>
      </div>
    </div>
    <nav class="nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">Progress saved locally in your browser.</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="notif-btn" title="Notifications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
          <span class="icon-dot" id="notif-dot" style="display:none"></span>
        </button>
        <button class="icon-btn" id="theme-toggle-topbar" title="Toggle theme">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
    <div class="view" id="main-scroll">
      <div id="view-container"></div>
    </div>
  </main>
</div>

<!-- ============ Modal ============ -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal-content"></div>
</div>

<!-- ============ Toasts ============ -->
<div id="toast-stack"></div>

<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/storage.js"></script>
<script src="js/notifications.js"></script>
<script src="js/quiz.js"></script>
<script src="js/projects.js"></script>
<script src="js/tasks.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/learning.js"></script>
<script src="js/app.js"></script>
</body>
</html>
